<div class="entrar">
  <h1>Portal dos Pais</h1>
  <p class="subtitulo">Selecione seu nome para ver a rotina do seu filho.</p>

  @if (carregando()) {
    <p>Carregando...</p>
  } @else if (erro()) {
    <p class="erro">Não foi possível carregar a lista. Verifique se a API está rodando.</p>
  } @else {
    <div class="lista-responsaveis">
      @for (responsavel of responsaveis(); track responsavel.id) {
        <button type="button" class="cartao-responsavel" (click)="selecionar(responsavel)">
          {{ responsavel.nome }}
        </button>
      }
    </div>
  }
</div>
