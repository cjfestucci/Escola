<div class="entrar">
  <h1>Quem está lançando?</h1>
  <p class="subtitulo">Selecione seu nome para abrir a rotina das turmas.</p>

  @if (carregando()) {
    <p>Carregando...</p>
  } @else if (erro()) {
    <p class="erro">Não foi possível carregar a lista. Verifique se a API está rodando.</p>
  } @else {
    <div class="lista-educadores">
      @for (educador of educadores(); track educador.id) {
        <button type="button" class="cartao-educador" (click)="selecionar(educador)">
          {{ educador.nome }}
        </button>
      }
    </div>
  }
</div>
