<header class="topbar">
  <button type="button" class="botao-menu" (click)="abrirMenu.emit()" aria-label="Abrir menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <line x1="4" y1="7" x2="20" y2="7" />
      <line x1="4" y1="12" x2="20" y2="12" />
      <line x1="4" y1="17" x2="20" y2="17" />
    </svg>
  </button>

  <h1 class="titulo-pagina">{{ titulo() }}</h1>

  <div class="usuario-topbar">
    @if (contextoService.contexto() === 'educador' && sessao.educadorNome(); as nome) {
      <span class="avatar-topbar">{{ nome.charAt(0) }}</span>
      <span class="nome-topbar">{{ nome }}</span>
      <button type="button" class="botao-trocar" (click)="sair()">Sair</button>
    }
    @if (contextoService.contexto() === 'portal' && sessao.responsavelNome(); as nome) {
      <span class="avatar-topbar">{{ nome.charAt(0) }}</span>
      <span class="nome-topbar">{{ nome }}</span>
      <button type="button" class="botao-trocar" (click)="sair()">Sair</button>
    }
  </div>
</header>
