@if (auth.estaLogado() && !paginaPublica()) {
  <app-sidebar [aberto]="menuAberto()" (fechar)="menuAberto.set(false)" />

  @if (menuAberto()) {
    <div class="app-backdrop" (click)="menuAberto.set(false)"></div>
  }
}

<div class="app-area" [class.app-area--sem-sidebar]="!auth.estaLogado() || paginaPublica()">
  <app-topbar [publica]="paginaPublica()" (abrirMenu)="menuAberto.set(true)" />
  @if (!paginaPublica()) {
    <app-aviso-assinatura />
  }

  <main class="app-conteudo">
    <router-outlet></router-outlet>
  </main>
</div>

<app-notificacoes />
