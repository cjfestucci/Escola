# Site do Gestor Tático. ${API_UPSTREAM} é trocado pelo nginx ao subir (variável de ambiente do contêiner).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Documentos de saúde chegam a 10 MB: folga pro corpo da requisição.
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API e arquivos enviados (fotos) ficam na aplicação .NET.
    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass ${API_UPSTREAM};
        proxy_set_header Host $host;
    }

    location = /healthz {
        proxy_pass ${API_UPSTREAM};
    }

    # O service worker (PWA) e o index nunca podem ficar em cache — senão o cliente não recebe versão nova.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /ngsw.json { add_header Cache-Control "no-cache"; }
    location = /ngsw-worker.js { add_header Cache-Control "no-cache"; }

    # Arquivos com hash no nome (main-XXXX.js etc.) podem ser guardados por muito tempo.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Rotas do Angular: qualquer caminho que não é arquivo volta pro index.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
